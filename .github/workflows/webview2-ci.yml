name: WebView2 backend CI

on:
  push:
    branches: [main]
    paths:
      - 'compat/webview2/**'
      - 'native_win32.c'
      - 'native_window.v'
      - 'surface.v'
      - 'surface_test.v'
      - 'display_list.v'
      - 'transport.v'
      - '.github/workflows/webview2-ci.yml'
  pull_request:
    paths:
      - 'compat/webview2/**'
      - 'native_win32.c'
      - 'native_window.v'
      - 'surface.v'
      - 'surface_test.v'
      - 'display_list.v'
      - 'transport.v'
      - '.github/workflows/webview2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-webview2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile native Win32 surface
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC installation not found" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          cmd /c ('call "' + $vcvars + '" && cl /nologo /W4 /c native_win32.c /Fo:native_win32.obj')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure pinned backend
        shell: pwsh
        run: cmake -S compat/webview2 -B compat/webview2/.build -D CMAKE_BUILD_TYPE=Release

      - name: Build backend
        shell: pwsh
        run: cmake --build compat/webview2/.build --config Release

      - name: Verify artifact
        shell: pwsh
        run: |
          $dll = 'compat/webview2/bin/vdesktop_webview2.dll'
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          Get-Item $dll | Format-List Name,Length,FullName
